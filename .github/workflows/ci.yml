name: guide-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 发布前自检
        run: node scripts/check.mjs .
      - name: 脚本语法检查
        run: for f in *.mjs scripts/*.mjs; do node --check "$f"; done
